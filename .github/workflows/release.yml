# .github/workflows/release.yml
name: Release
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        env:
          HUSKY: 0
      - id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: ${{ github.actor }}@users.noreply.github.com
      - id: check
        run: |
          after=$(git rev-parse HEAD)
          if [ "${{ steps.before.outputs.sha }}" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./frontend/package.json').version")" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch_flag: --linux AppImage:x64 AppImage:arm64
          - os: windows-latest
            arch_flag: ""
          - os: macos-latest
            arch_flag: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-pack
      - run: cd simulator && wasm-pack build --target web --release
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      - run: cd frontend && npx electron-builder ${{ matrix.arch_flag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach installer to release
        shell: bash
        run: find frontend/release -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.msi" -o -name "*.dmg" \) -print0 | xargs -0 -r gh release upload "v${{ needs.release.outputs.version }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
